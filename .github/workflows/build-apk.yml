name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Make Gradlew Executable Early
        run: chmod +x android/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learning-English-PRO-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          name: "Learning English PRO - Android APK v1.0.0"
          tag_name: "v1.0.0-apk"
          draft: false
          prerelease: false
          body: |
            ## 🎉 Tải Về File APK Android
            
            Ứng dụng **Learning English PRO (Mochi Anki)** cho thiết bị Android:
            - Đầy đủ tính năng ôn tập thời điểm vàng SRS (5 cấp độ Mochi)
            - 10 Unit Luyện Nói IELTS (Part 1, 2, 3)
            - Giám khảo Gojo AI & Gemini AI trực tiếp
            - Giao diện Liquid Glass siêu mượt
            - 100% dữ liệu thẻ lưu trữ cục bộ, hoạt động offline!
            
            👉 **Tải file `app-debug.apk` đính kèm bên dưới về điện thoại và mở để cài đặt ngay.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

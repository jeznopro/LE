name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Make Gradlew Executable Early
        run: chmod +x android/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/ || true
          npx cap copy android || true

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== GRADLE FAILURE LOG ==="
            tail -n 80 ../gradle.log
            FAIL_LINE=$(grep -A 8 "What went wrong:" ../gradle.log | tr '\r\n' ' ' | sed 's/[^a-zA-Z0-9 :.,_\/-]/ /g')
            echo "::error title=Gradle Detail::$FAIL_LINE"
            LOG_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@../gradle.log" https://catbox.moe/user/api.php || true)
            echo "::error title=Gradle Log URL::$LOG_URL"
            exit $STATUS
          fi
          echo "=== BUILD SUCCEEDED ==="
          ls -lh app/build/outputs/apk/debug/
          
          # Upload direct download link to catbox.moe
          DIRECT_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@app/build/outputs/apk/debug/app-debug.apk" https://catbox.moe/user/api.php || true)
          echo "Direct Download URL: $DIRECT_URL"
          if [[ "$DIRECT_URL" =~ ^https:// ]]; then
            echo "::notice title=Direct APK Download Link::$DIRECT_URL"
            echo "## 🚀 Link Tải APK Trực Tiếp (1-Click)" >> $GITHUB_STEP_SUMMARY
            echo "👉 [Bấm vào đây để tải app-debug.apk]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gradle Build Log On Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learning-English-PRO-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK (Optional)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "Learning English PRO - Android APK (v1.0.${{ github.run_number }})"
          tag_name: "v1.0.${{ github.run_number }}-apk"
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## 🎉 Tải Về File APK Android (Learning English PRO)
            
            - **Hệ thống Spaced Repetition (SRS)** chuẩn thuật toán MochiMochi với 5 cấp độ ghi nhớ.
            - **10 Unit Luyện Nói IELTS** theo giáo trình thực chiến (Part 1, 2, 3).
            - **Giám khảo Gojo AI** trò chuyện phản xạ trực tiếp.
            - **100% dữ liệu lưu trữ trên máy**, học hoàn toàn offline mượt mà.
            
            👉 **Tải file `app-debug.apk` ở phần Assets bên dưới về điện thoại Android và mở để cài đặt ngay!**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
